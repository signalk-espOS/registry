name: Validate

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push to a pull request makes the run already in
# flight for it pointless. main keys on the commit so a merge's own run is
# never cancelled by the push that follows it.
concurrency:
  group: validate-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate project entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate.mjs
      - name: Rebuild the index and check it was committed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp index.json /tmp/index-committed.json
          node scripts/reindex.mjs
          # Compare everything EXCEPT `updated`, which is a build timestamp and
          # therefore differs on every run. Comparing the whole file made this
          # check impossible to satisfy rather than merely strict.
          strip() { node -e '
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            delete d.updated;
            process.stdout.write(JSON.stringify(d, null, 2));
          ' "$1"; }
          if ! diff -q <(strip /tmp/index-committed.json) <(strip index.json) >/dev/null; then
            echo "::error::index.json does not match the project entries — run scripts/reindex.mjs and commit the result"
            diff <(strip /tmp/index-committed.json) <(strip index.json) | head -40 || true
            exit 1
          fi
          echo "index.json matches the project entries."
