name: Validate

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push to a pull request makes the run already in
# flight for it pointless. main keys on the commit so a merge's own run is
# never cancelled by the push that follows it.
concurrency:
  group: validate-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit and its first parent, the base: enough to see
          # whether the pull request touches index.json.
          fetch-depth: 2
      # main is served to boats as it is, so an index.json from a pull request
      # would be live the moment it merges, and a stale or hand-made one stays
      # there until the next rebuild. reindex.yml writes it after the merge.
      - name: The pull request leaves index.json to CI
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- index.json; then
            echo "::error::This pull request changes index.json. Drop that change: the index is rebuilt and committed automatically after the merge."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate project entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate.mjs
      # What the entries resolve to, as a preview: the index itself is rebuilt
      # and committed by reindex.yml after the merge, so a pull request is
      # the project file alone. Requiring the regenerated index in the PR
      # failed every open PR each time any listed project cut a release, and
      # sent contributors to run a script whose output depended on their
      # token and the hour.
      - name: Preview the index these entries produce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reindex.mjs
